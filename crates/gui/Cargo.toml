[package]
name = "noet-gui"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Noet — native (Rust + Slint) notes + typed-todos + projects over plain markdown. The Slint GUI frontend over noet-core."
default-run = "noet"

[[bin]]
name = "noet"
path = "src/main.rs"

[dependencies]
noet-core = { path = "../core" }
# WYSIWYG editor engine (UI-free; Slint-version-independent). Pinned to a public
# rev so CI release builds resolve it without a sibling checkout. Drives the
# opt-in "WYSIWYG (beta)" editor; the raw TextEdit remains the default/fallback.
sred-core = { git = "https://github.com/marctjones/sred", tag = "v0.6.0", features = ["syntax-highlight"] }
slint = "1.13"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
arboard = "3"
spellbook = "0.4"
notify = "6"
open = "5"
anyhow = "1"

[build-dependencies]
slint-build = "1.13"

[dev-dependencies]
# Headless Slint backend for automated GUI tests (ElementHandle, simulated input,
# mocked time). Tracks the slint version.
i-slint-backend-testing = "1.13"
