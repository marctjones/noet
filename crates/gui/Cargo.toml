[package]
name = "noet-gui"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Noet — native (Rust + Slint) notes + typed-todos + projects over plain markdown. The Slint GUI frontend over noet-core."
default-run = "noet"

[[bin]]
name = "noet"
path = "src/main.rs"

[dependencies]
noet-core = { path = "../core" }
# WYSIWYG editor engine (UI-free; Slint-version-independent). Pinned to a public
# tag so CI release builds resolve it without a sibling checkout. This is Noet's
# sole note editor; track the latest STABLE tag (not -alpha).
sred-core = { git = "https://github.com/marctjones/sred", tag = "v0.7.6", features = ["syntax-highlight"] }
# Optional native Typst renderer for inline math/figure fragments in the editor.
# OFF by default: it pulls the whole Typst compiler (~59 crates, ~50s added to
# every rebuild, much larger binary), which isn't worth it for a notes app unless
# you write Typst math often. Enable with `--features typst-math`.
sred-typst = { git = "https://github.com/marctjones/sred", tag = "v0.7.6", optional = true }
slint = "1.13"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
arboard = "3"
spellbook = "0.4"
notify = "6"
open = "5"
anyhow = "1"

[features]
# Inline-render Typst math/figures in the editor (overlays rendered images on the
# source span). Heavy build cost; opt-in. See compose_fragments in main.rs.
typst-math = ["dep:sred-typst"]

[build-dependencies]
slint-build = "1.13"

[dev-dependencies]
# Headless Slint backend for automated GUI tests (ElementHandle, simulated input,
# mocked time). Tracks the slint version.
i-slint-backend-testing = "1.13"

[target.'cfg(target_os = "windows")'.dependencies]
auto-launch = "0.6.0"
global-hotkey = "0.8.0"
tray-icon = "0.24.0"
