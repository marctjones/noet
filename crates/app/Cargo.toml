[package]
name = "noet-app"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Noet application model: selection, commands, workspaces, panes, and surfaces between noet-core and GUI frontends."

[lib]
name = "noet_app"
path = "src/lib.rs"

[dependencies]
noet-ai = { path = "../ai" }
noet-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
