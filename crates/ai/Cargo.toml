[package]
name = "noet-ai"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Noet local AI contracts: local model profiles, runtime capabilities, tools, proposals, and housekeeping jobs."

[lib]
name = "noet_ai"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mistralrs = { version = "0.8.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[features]
default = []
mistralrs-inline = ["dep:mistralrs", "dep:tokio"]
mistralrs-inline-metal = ["mistralrs-inline", "mistralrs/metal", "mistralrs/accelerate"]
