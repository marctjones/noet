name: Release

# Build the Windows 11 + Linux + macOS binaries and publish a GitHub Release
# whenever a version tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# All jobs upload to the same release for the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release (GUI)
        run: cargo build --release -p noet-gui

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/noet.exe dist/noet.exe
          Copy-Item README.md dist/README.md
          Copy-Item CHANGELOG.md dist/CHANGELOG.md
          Compress-Archive -Path dist/* -DestinationPath "noet-${{ github.ref_name }}-windows-x86_64.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            noet-${{ github.ref_name }}-windows-x86_64.zip
            target/release/noet.exe
          generate_release_notes: true
          body: |
            Noet ${{ github.ref_name }}. No installer — portable.

            **Windows:** download `noet.exe` (or the `.zip`) and run it.
            **macOS:** download the `.dmg`, drag **Noet** to Applications. If macOS
            says it can't verify the developer (unsigned build), right-click
            **Noet → Open**, or run `xattr -dr com.apple.quarantine /Applications/Noet.app`.
            **Linux:** download the `.tar.gz` (unpack, run `./noet`) or the `.deb`
            (`sudo apt install ./noet_*_amd64.deb`).

            Your notes live in `~/Documents/NoetVault` (change it in Settings, or
            set `NOET_VAULT`); the rebuildable index lives in your OS cache dir,
            never inside the vault. See CHANGELOG.md for what's included.

  linux:
    name: Build Linux binary (tarball + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Slint's FemtoVG renderer needs fontconfig headers to build.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Build release (GUI)
        run: cargo build --release -p noet-gui

      - name: Stage tarball
        run: |
          mkdir -p dist
          cp target/release/noet dist/noet
          cp README.md CHANGELOG.md dist/
          tar -C dist -czf "noet-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=pkgroot
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/noet"
          install -m 0755 target/release/noet "$PKG/usr/bin/noet"
          cp CHANGELOG.md "$PKG/usr/share/doc/noet/changelog"
          # Desktop entry (launcher + "New meeting note" action; aids GNOME window grouping).
          install -Dm644 packaging/linux/noet.desktop "$PKG/usr/share/applications/noet.desktop"
          # Build the control file with echo so YAML indentation can't corrupt it.
          {
            echo "Package: noet"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: libfontconfig1, libgl1, libxkbcommon0"
            echo "Maintainer: Marc Jones <marc.t.jones@gmail.com>"
            echo "Description: Native notes + typed-todos + projects over plain markdown"
            echo " Noet is a native (Rust + Slint) personal-information manager that"
            echo " keeps plain markdown files as the source of truth."
          } > "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG" "noet_${VERSION}_amd64.deb"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            noet-${{ github.ref_name }}-linux-x86_64.tar.gz
            noet_*_amd64.deb

  macos:
    name: Build macOS binary (Apple Silicon .dmg + tarball)
    runs-on: macos-latest
    # Signing + notarization are optional: every step below that needs an Apple
    # credential is gated on `env.MAC_CERT`/`env.NOTARY_ID` being non-empty, so
    # the job still produces a working (unsigned) .dmg until these repo secrets
    # are set. To ship signed + notarized builds, add:
    #   MACOS_CERTIFICATE       base64 of your "Developer ID Application" .p12
    #   MACOS_CERTIFICATE_PWD   the .p12 export password
    #   MACOS_NOTARY_APPLE_ID   Apple ID email enrolled in the Developer Program
    #   MACOS_NOTARY_PWD        an app-specific password (appleid.apple.com)
    #   MACOS_NOTARY_TEAM_ID    your 10-char Team ID
    env:
      MAC_CERT: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Import the Developer ID cert into an ephemeral keychain and auto-detect
      # the signing identity hash (so no separate identity-name secret is needed).
      - name: Import signing certificate
        if: env.MAC_CERT != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 21600 -u build.keychain
          security import cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f cert.p12
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using signing identity $IDENTITY"

      # Use the same Apple Silicon packaging script as local builds so CI and
      # manual release checks exercise one code path. The script ad-hoc signs
      # when SIGN_IDENTITY is absent, and signs with the Developer ID identity
      # imported above when credentials are configured.
      - name: Build Noet.app, DMG, and tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOET_MACOS_VERSION="$VERSION" \
            NOET_MACOS_ARTIFACT_LABEL="$GITHUB_REF_NAME" \
            NOET_MACOS_BUNDLE_VERSION="$VERSION" \
            ./scripts/package-macos.sh

      - name: Sign .dmg
        if: env.MAC_CERT != ''
        run: |
          codesign --force --timestamp \
            --sign "$SIGN_IDENTITY" "noet-${GITHUB_REF_NAME}-macos-arm64.dmg"

      # Notarize the .dmg and staple the ticket so Gatekeeper passes offline.
      # Only runs when notary credentials are present (and signing happened).
      - name: Notarize + staple .dmg
        if: env.MAC_CERT != '' && env.NOTARY_ID != ''
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          DMG="noet-${GITHUB_REF_NAME}-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PWD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            noet-${{ github.ref_name }}-macos-arm64.dmg
            noet-${{ github.ref_name }}-macos-arm64.tar.gz
